<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Create Account - IUHSVBOOK</title>

    <!-- =====================================================
         FONT
    ====================================================== -->

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      href="https://fonts.googleapis.com/css2?family=Inter&family=Unica+One&display=swap"
      rel="stylesheet"
    />

    <!-- =====================================================
         CSS
    ====================================================== -->

    <link rel="stylesheet" href="../css/create.css" />
  </head>

  <body>
    <!-- =====================================================
         HEADER
    ====================================================== -->

    <header class="header">
      <!-- LOGO -->
      <a href="../index.html" class="logo">
        <img src="../images/logo.jpg" alt="IUHSVBOOK" />

        <p>IUHSVBOOK</p>
      </a>

      <!-- LOGIN BUTTON -->
      <button id="Login" type="button">Login</button>
    </header>

    <!-- =====================================================
         MAIN
    ====================================================== -->

    <main class="main">
      <!-- ===================================================
           CREATE FORM
      ==================================================== -->

      <section class="create-form">
        <!-- FORM HEADER -->
        <div class="form-header">
          <h1>Create now</h1>

          <p>Hi, Welcome to IUHSVBOOK 👋</p>
        </div>

        <!-- FORM BODY -->
        <div class="form-body">
          <form id="createForm">
            <!-- USERNAME -->
            <div class="input-group" id="usernameGroup">
              <label for="username"> Username </label>

              <input
                type="text"
                id="username"
                name="username"
                placeholder="Enter your username"
                autocomplete="username"
                required
              />
            </div>

            <!-- PASSWORD -->
            <div class="input-group" id="passwordGroup">
              <label for="password"> Password </label>

              <div class="passwordBox">
                <input
                  type="password"
                  id="password"
                  name="password"
                  placeholder="Enter your password"
                  autocomplete="new-password"
                  required
                />

                <button
                  type="button"
                  class="password-toggle"
                  aria-label="Show password"
                >
                  <img
                    src="../images/eye.png"
                    alt="Show Password"
                    id="togglePassword"
                  />
                </button>
              </div>
            </div>

            <!-- CONFIRM PASSWORD -->
            <div class="input-group" id="confirmPasswordGroup">
              <label for="confirmPassword">Confirm password</label>

              <div class="passwordBox">
                <input
                  type="password"
                  id="confirmPassword"
                  name="confirmPassword"
                  placeholder="Enter your confirm password"
                  autocomplete="new-password"
                  required
                />

                <button
                  type="button"
                  class="password-toggle"
                  aria-label="Show confirm password"
                >
                  <img
                    src="../images/eye.png"
                    alt="Show Password"
                    id="toggleConfirmPassword"
                  />
                </button>
              </div>
            </div>

            <!-- CREATE ACCOUNT -->
            <button type="submit" class="create-account-btn">
              Create account
            </button>
          </form>

          <!-- LOGIN -->
          <div class="Login">
            <p>
              Have an account?
              <a href="../pages/login.html"> Login </a>
            </p>
          </div>
        </div>
      </section>

      <!-- ===================================================
           IMAGE
      ==================================================== -->

      <section class="login-image">
        <div class="img-bg"></div>

        <img src="../images/loginImage.jpg" alt="IUHSVBOOK" />
      </section>
    </main>

    <!-- =====================================================
         JAVASCRIPT
    ====================================================== -->

    <!-- Local Storage -->
    <script src="../js/localStore.js"></script>

    <!-- Create Account -->
    <script src="../js/create.js"></script>
  </body>
</html>
