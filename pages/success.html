<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Success | IUHSVBOOK</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700&family=Unica+One&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="../css/style.css" />
    <link rel="stylesheet" href="../css/success.css" />
    <link rel="stylesheet" href="../css/shoppingCartSideBar.css" />
  </head>

  <body>
    <header class="header">
      <a href="../index.html" class="logo">
        <img src="../images/iconlogo.png" alt="IUHSVBOOK" />
        <span>IUHSVBOOK</span>
      </a>

      <nav class="header-menu">
        <a href="../index.html" class="home">
          <img src="../images/HOME_SIMPLE.png" alt="Home" />
          <span>Home</span>
        </a>

        <a href="../bookmark.html" class="bookmark">
          <img src="../images/iconbookmark.png" alt="Bookmark" />
          <span>Bookmark</span>
        </a>

        <a href="../product.html" class="product">
          <img src="../images/iconsach.png" alt="Products" />
          <span>Tất cả sản phẩm</span>
        </a>

        <a href="#" class="cart" id="cartButton">
          <img src="../images/iconcart.png" alt="Cart" />
          <span>Giỏ hàng</span>
        </a>
      </nav>

      <div class="auth-menu">
        <div class="user-area">
          <a href="../pages/login.html" class="sign-in" id="signInButton">
            <img src="../images/iconlogin.png" alt="Login" />
            <span>LOGIN</span>
          </a>

          <a
            href="../pages/create.html"
            class="create-account"
            id="createAccountButton"
          >
            SIGN UP
          </a>
        </div>

        <div class="user-info" id="userInfo">
          <img src="../images/iconlogin.png" alt="User" />
          <span id="usernameDisplay"></span>
          <button type="button" id="logoutButton">LOGOUT</button>
        </div>
      </div>
    </header>

    <main class="success-page">
      <section class="success-box">
        <img
          class="success-image"
          src="../images/iconcongratulations.png"
          alt="Success"
        />

        <h1>Thank you for your order!</h1>

        <p>Check your e-mail inbox for the receipt</p>

        <button type="button" class="continue-shopping" id="continueShopping">
          <img src="../images/SHOPPING_CART.png" alt="Shopping Cart" />

          <span>Continue Shopping</span>
        </button>
      </section>
    </main>

    <script src="../js/shoppingCartSidebar.js"></script>
    <script src="../js/success.js"></script>
  </body>
</html>
