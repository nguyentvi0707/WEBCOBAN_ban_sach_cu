<!doctype html>

<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>LOGIN - IUHSVBOOK</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Unica+One&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="../css/login.css" />
  </head>

  <body>
    <header class="header">
      <a href="../index.html" class="logo" aria-label="IUHSVBOOK Home">
        <img src="../images/logo.jpg" alt="IUHSVBOOK" />

        <span>IUHSVBOOK</span>
      </a>

      <div class="header-actions">
        <a href="../index.html" class="home-link" aria-label="Trang chủ">
          <img src="../images/HOME_SIMPLE.png" alt="Home" />

          <span>Home</span>
        </a>

        <button id="createAccount" type="button">Create Account</button>
      </div>
    </header>

    <main class="main">
      <section class="login-form">
        <div class="form-header">
          <h1>Login now</h1>

          <p>Hi, Welcome back 👋</p>
        </div>

        <div class="form-body">
          <form id="loginForm" novalidate>
            <div class="input-group" id="emailGroup">
              <label for="email"> Email </label>

              <input
                type="email"
                id="email"
                name="email"
                placeholder="Enter your email"
                autocomplete="email"
                required
              />

              <small class="input-error" id="emailError"></small>
            </div>

            <div class="input-group" id="passwordGroup">
              <label for="password"> Password </label>

              <div class="passwordBox">
                <input
                  type="password"
                  id="password"
                  name="password"
                  placeholder="Enter your password"
                  autocomplete="current-password"
                  required
                />

                <button
                  type="button"
                  class="password-toggle"
                  aria-label="Show password"
                >
                  <img
                    src="../images/eye.png"
                    alt="Show password"
                    id="togglePassword"
                  />
                </button>
              </div>

              <small class="input-error" id="passwordError"></small>
            </div>

            <div class="login-options">
              <label class="remember-me" for="rememberMe">
                <input type="checkbox" id="rememberMe" name="rememberMe" />

                <span>Remember me</span>
              </label>

              <a href="#" id="forgotPassword"> Forgot password? </a>
            </div>

            <button type="submit" class="login-submit">Login</button>

            <p class="login-message" id="loginMessage"></p>
          </form>

          <div class="register">
            <p>
              Not registered yet?

              <a href="../pages/create.html"> Create an account </a>
            </p>
          </div>
        </div>
      </section>

      <section class="login-image">
        <div class="img-bg"></div>

        <img src="../images/loginImage.jpg" alt="IUHSVBOOK Library" />
      </section>
    </main>

    <script src="../js/localStore.js"></script>
    <script src="../js/login.js"></script>
  </body>
</html>
